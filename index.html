<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#6b4b7b"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Chino Kids"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="format-detection" content="telephone=no"/>
<title>中文小英雄 · Flashcards de chino</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<style>
:root{
  --bg:#fff8ef; --ink:#24314d; --purple:#6b4b7b; --pink:#ff7fa2; --yellow:#ffd35a;
  --cyan:#43c7c7; --green:#62c58b; --red:#ff6b6b; --card:#ffffff; --muted:#6d7486;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#fff9f0,#f7f5ff);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid #ece8f3}
.head{max-width:1180px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:900;font-size:20px}.logo b{color:var(--purple)} .progress{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:800}
.bar{width:160px;height:11px;border-radius:10px;background:#ececf4;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0}
nav{max-width:1180px;margin:0 auto;padding:8px 18px 12px;display:flex;gap:8px;overflow:auto}
nav button{white-space:nowrap;border:0;border-radius:999px;padding:9px 13px;background:#f0ecf5;color:#4a3b57;font-weight:800;cursor:pointer}
nav button.active{background:var(--purple);color:white}
main{max-width:1180px;margin:auto;padding:24px 18px 70px}
section{display:none}.section.active{display:block}.hero{background:linear-gradient(135deg,#6b4b7b,#8d6aa0);color:white;border-radius:26px;padding:26px;box-shadow:0 14px 35px #6b4b7b22;margin-bottom:18px}
.hero h1{margin:0 0 6px;font-size:clamp(26px,4vw,44px)}.hero p{margin:0;opacity:.95;font-size:17px;max-width:850px}
.activity{background:var(--card);border-radius:24px;padding:20px;margin:18px 0;box-shadow:0 8px 26px #3c315012;border:1px solid #eee8f4}
.activity h2{margin:0 0 5px;font-size:22px}.kicker{display:inline-block;padding:5px 10px;border-radius:999px;background:#fff1c7;font-weight:900;color:#7c5d00;margin-bottom:10px}
.help{color:var(--muted);margin:0 0 15px}
.grid{display:grid;gap:14px}.grid.cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.flash{height:300px;perspective:1000px;cursor:pointer}.flash-inner{position:relative;width:100%;height:100%;transition:.55s;transform-style:preserve-3d}.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;border:3px solid #eee9f5;overflow:hidden}
.front{background:linear-gradient(160deg,#fff,#fff6e7)}.back{transform:rotateY(180deg);background:white}
.hanzi{font-size:clamp(40px,5vw,62px);font-weight:900;line-height:1.15;text-align:center}.pinyin{font-size:20px;color:#7a5c89;margin-top:9px;font-weight:800}
.meaning{font-size:22px;font-weight:900;margin:5px 0 10px;text-align:center}.back img{width:100%;height:175px;object-fit:contain;border-radius:14px;background:#fafafa}
.small{font-size:12px;color:#838899}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button,.btn{border:0;border-radius:13px;padding:10px 14px;font-weight:900;cursor:pointer;font-size:14px}.primary{background:var(--purple);color:#fff}.secondary{background:#e8f8f6;color:#176c6c}.yellow{background:#fff1bd;color:#715600}.danger{background:#ffe4e4;color:#8a2f2f}
.quiz{display:grid;gap:12px}.qbox{background:#faf9fd;border-radius:18px;padding:16px}.qtitle{font-weight:900;font-size:18px;margin-bottom:10px}
.options{display:flex;gap:9px;flex-wrap:wrap}.option{background:#fff;border:2px solid #ebe6f0;color:var(--ink)}.option.correct{background:#ddf8e8;border-color:#5fc88a}.option.wrong{background:#ffe5e5;border-color:#ff8a8a}
.feedback{font-weight:900;min-height:24px;margin-top:8px}.builder{display:flex;gap:9px;flex-wrap:wrap;min-height:52px;padding:11px;background:#f7f5fb;border-radius:16px}.token{background:white;border:2px solid #ddd5e8;border-radius:12px;padding:8px 11px;font-size:18px;cursor:pointer}.target{margin-top:10px;border:2px dashed #bfb1cc;background:#fff;border-radius:16px;min-height:55px;padding:10px;display:flex;gap:8px;flex-wrap:wrap}
.canvasWrap{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:18px;align-items:start}.writePanel{background:#fbfafc;border-radius:18px;padding:14px}.charSelect{width:100%;padding:10px;border-radius:10px;border:1px solid #d8d2df;font-size:16px}
canvas{width:100%;max-width:420px;aspect-ratio:1/1;background:white;border:3px solid #e2dbea;border-radius:18px;touch-action:none}
.example{background:#f1fbfb;border-left:5px solid var(--cyan);padding:12px 14px;border-radius:12px;margin:10px 0}.cn{font-size:24px;font-weight:900}.py{color:#6d5b75}.es{color:#586174}
.inputline{width:100%;padding:12px;border:2px solid #e4deea;border-radius:13px;font-size:17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#f3ecff;color:#5c3e77;padding:5px 9px;border-radius:999px;font-weight:800;margin:3px}
.challenge{background:linear-gradient(135deg,#fff1bd,#ffe6ef);border-radius:22px;padding:18px;margin-top:18px}
.star{font-size:20px}.hidden{display:none!important}
@media(max-width:760px){.canvasWrap,.two{grid-template-columns:1fr}.flash{height:270px}.bar{width:90px}.progress span.label{display:none}}

/* ===== Optimización iPad / iPhone ===== */
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{
  min-height:100dvh;
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
header{
  padding-top:env(safe-area-inset-top);
}
button,.btn,.token,.flash,nav button{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button,.btn,nav button{min-height:44px}
input,select,textarea{font-size:16px!important} /* evita zoom automático en iPhone */
.face{-webkit-backface-visibility:hidden}
.flash-inner{-webkit-transform-style:preserve-3d}
.flash.flipped .flash-inner{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
canvas{display:block;max-width:100%;height:auto}
.ios-tip{
  background:linear-gradient(135deg,#f2ecff,#e9fbf7);
  border:1px solid #ded3ef;
  border-radius:18px;
  padding:14px 16px;
  margin:0 0 18px;
  font-size:14px;
  line-height:1.45;
}
.ios-tip strong{color:#5c3e77}
#mobileMenuBtn{display:none}
@media (max-width:900px){
  main{padding:18px 14px calc(86px + env(safe-area-inset-bottom))}
  .head{padding:10px 12px}
  nav{padding:7px 12px 10px;scroll-snap-type:x proximity}
  nav button{scroll-snap-align:start}
  .hero{padding:20px;border-radius:22px}
  .activity{padding:16px;border-radius:20px}
  .grid.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flash{height:270px}
  .face{padding:12px}
  .hanzi{font-size:clamp(34px,8vw,56px)}
  .pinyin{font-size:18px}
  .back img{height:145px}
}
@media (max-width:520px){
  .logo{font-size:16px}
  .progress{font-size:14px}
  .bar{width:70px}
  .grid.cards{grid-template-columns:1fr}
  .flash{height:330px}
  .back img{height:190px}
  .hero h1{font-size:30px}
  .hero p{font-size:15px}
  .activity h2{font-size:20px}
  .qtitle{font-size:17px}
  .option,.token{width:100%;text-align:center}
  .builder,.target{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions button{flex:1 1 140px}
  .canvasWrap{gap:12px}
}
@media (orientation:landscape) and (max-height:500px){
  header{position:relative}
  .flash{height:260px}
  .hero{padding:16px}
}

</style>
</head>
<body>
<header>
  <div class="head">
    <div class="logo">🐼 <b>中文小英雄</b> · Chino para primaria</div>
    <div class="progress"><span class="label">Estrellas</span> ⭐ <span id="stars">0</span><div class="bar"><i id="barFill"></i></div></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"><div class="ios-tip" id="iosTip"><strong>📱 Modo iPad/iPhone:</strong> funciona con toque, escritura con dedo o Apple Pencil y audio. Si lo publicas en GitHub Pages, ábrelo en Safari y usa <b>Compartir → Añadir a pantalla de inicio</b> para usarlo como app.</div></main>
<script>
const DATA = {"hobbies": [{"hanzi": "听音乐", "pinyin": "tīng yīn yuè", "es": "Escuchar música", "img": "assets/听音乐.png"}, {"hanzi": "唱歌", "pinyin": "chàng gē", "es": "Cantar canciones", "img": "assets/唱歌.png"}, {"hanzi": "跳舞", "pinyin": "tiào wǔ", "es": "Bailar", "img": "assets/跳舞.png"}, {"hanzi": "读书/看书", "pinyin": "dú shū / kàn shū", "es": "Leer libro", "img": "assets/读书_看书.png"}, {"hanzi": "吃东西", "pinyin": "chī dōng xi", "es": "Comer cosas", "img": "assets/吃东西.png"}, {"hanzi": "踢足球", "pinyin": "tī zú qiú", "es": "Jugar fútbol", "img": "assets/踢足球.png"}, {"hanzi": "游泳", "pinyin": "yóu yǒng", "es": "Nadar", "img": "assets/游泳.png"}, {"hanzi": "睡觉", "pinyin": "shuì jiào", "es": "Dormir", "img": "assets/睡觉.png"}, {"hanzi": "滑雪", "pinyin": "huá xuě", "es": "Esquiar", "img": "assets/滑雪.png"}, {"hanzi": "滑冰", "pinyin": "huá bīng", "es": "Patinar sobre hielo", "img": "assets/滑冰.png"}, {"hanzi": "画画儿", "pinyin": "huà huàr", "es": "Dibujar", "img": "assets/画画儿.png"}, {"hanzi": "做菜", "pinyin": "zuò cài", "es": "Hacer comida / cocinar", "img": "assets/做菜.png"}, {"hanzi": "玩牌", "pinyin": "wán pái", "es": "Jugar a las cartas", "img": "assets/玩牌.png"}, {"hanzi": "玩电脑游戏", "pinyin": "wán diàn nǎo yóu xì", "es": "Jugar a videojuegos", "img": "assets/玩电脑游戏.png"}], "foods": [{"hanzi": "面包", "pinyin": "miàn bāo", "es": "Pan", "cat": "Comidas", "img": "assets/面包.png"}, {"hanzi": "鸡蛋", "pinyin": "jī dàn", "es": "Huevo", "cat": "Comidas", "img": "assets/鸡蛋.png"}, {"hanzi": "牛奶", "pinyin": "niú nǎi", "es": "Leche", "cat": "Bebidas", "img": "assets/牛奶.png"}, {"hanzi": "果汁", "pinyin": "guǒ zhī", "es": "Jugo", "cat": "Bebidas", "img": "assets/果汁.png"}, {"hanzi": "水", "pinyin": "shuǐ", "es": "Agua", "cat": "Bebidas", "img": "assets/水.png"}, {"hanzi": "包子", "pinyin": "bāo zi", "es": "Panecillo chino", "cat": "Comidas", "img": "assets/包子.png"}, {"hanzi": "饺子", "pinyin": "jiǎo zi", "es": "Empanadas chinas", "cat": "Comidas", "img": "assets/饺子.png"}, {"hanzi": "蛋糕", "pinyin": "dàn gāo", "es": "Pastel", "cat": "Dulces", "img": "assets/蛋糕.png"}, {"hanzi": "糖果", "pinyin": "táng guǒ", "es": "Caramelos", "cat": "Dulces", "img": "assets/糖果.png"}, {"hanzi": "冰淇淋", "pinyin": "bīng qí lín", "es": "Helado", "cat": "Dulces", "img": "assets/冰淇淋.png"}, {"hanzi": "巧克力", "pinyin": "qiǎo kè lì", "es": "Chocolate", "cat": "Dulces", "img": "assets/巧克力.png"}, {"hanzi": "苹果", "pinyin": "píng guǒ", "es": "Manzana", "cat": "Frutas", "img": "assets/苹果.png"}, {"hanzi": "香蕉", "pinyin": "xiāng jiao", "es": "Bananas", "cat": "Frutas", "img": "assets/香蕉.png"}, {"hanzi": "草莓", "pinyin": "cǎo méi", "es": "Fresa", "cat": "Frutas", "img": "assets/草莓.png"}, {"hanzi": "葡萄", "pinyin": "pú táo", "es": "Uvas", "cat": "Frutas", "img": "assets/葡萄.png"}], "verbs": [{"hanzi": "吃", "pinyin": "chī", "es": "Comer", "img": "assets/吃.png"}, {"hanzi": "喝", "pinyin": "hē", "es": "Beber", "img": "assets/喝.png"}]};
const sections = [
 {id:"hobbies",title:"1. Pasatiempos",emoji:"🎨"},
 {id:"foods",title:"2. Comidas, bebidas y postres",emoji:"🍎"},
 {id:"ai",title:"3. 爱 / 不爱",emoji:"❤️"},
 {id:"xihuan",title:"4. 喜欢 / 不喜欢",emoji:"😊"},
 {id:"hui",title:"5. 会 / 不会",emoji:"🏊"},
 {id:"chihe",title:"6. 吃 y 喝",emoji:"🥢"},
 {id:"zui",title:"7. 最 + 喜欢 / 爱",emoji:"🏆"}
];
let stars = +(localStorage.getItem("cnStars")||0);
function addStar(n=1){stars+=n;localStorage.setItem("cnStars",stars);updateStars(); confetti();}
function updateStars(){document.getElementById("stars").textContent=stars;document.getElementById("barFill").style.width=Math.min(100,(stars%30)/30*100)+"%"}
function speak(t){
  if(!("speechSynthesis" in window)) return alert("Tu navegador no tiene lectura en voz alta.");
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="zh-CN"; u.rate=.72; u.pitch=1.02;
  const voices=speechSynthesis.getVoices();
  const zh=voices.find(v=>/^zh(-|_)?CN/i.test(v.lang)) || voices.find(v=>/^zh/i.test(v.lang));
  if(zh) u.voice=zh;
  setTimeout(()=>speechSynthesis.speak(u),50);
}
function confetti(){const el=document.createElement("div");el.textContent="⭐";Object.assign(el.style,{position:"fixed",left:(20+Math.random()*60)+"%",top:"35%",fontSize:"42px",zIndex:99,transition:"1s",pointerEvents:"none"});document.body.appendChild(el);requestAnimationFrame(()=>{el.style.transform="translateY(-100px) scale(1.7) rotate(20deg)";el.style.opacity=0});setTimeout(()=>el.remove(),1000)}

function flashcards(items){
 return `<div class="grid cards">${items.map((x,i)=>`
 <div class="flash" onclick="this.classList.toggle('flipped')">
   <div class="flash-inner">
     <div class="face front"><div class="hanzi">${x.hanzi}</div><div class="pinyin">${x.pinyin}</div><div class="small">Toca para voltear</div></div>
     <div class="face back"><div class="meaning">${x.es}</div>${x.img?`<img src="${x.img}" alt="${x.es}">`:""}<div class="actions">
       <button class="secondary" onclick="event.stopPropagation();speak('${x.hanzi.replaceAll("'","")}')">🔊 Escuchar</button>
       <button class="yellow" onclick="event.stopPropagation();addStar()">⭐ La sabía</button>
     </div></div>
   </div>
 </div>`).join("")}</div>`;
}
function choiceQuiz(id, qs){
 return `<div class="quiz">${qs.map((q,idx)=>`<div class="qbox"><div class="qtitle">${idx+1}. ${q.q}</div><div class="options">${q.opts.map(o=>`<button class="option" onclick="answer(this,${JSON.stringify(o===q.a)})">${o}</button>`).join("")}</div><div class="feedback"></div></div>`).join("")}</div>`;
}
function answer(btn,ok){const box=btn.closest(".qbox");if(box.dataset.done)return;box.dataset.done="1";btn.classList.add(ok?"correct":"wrong");box.querySelector(".feedback").textContent=ok?"✅ ¡Muy bien! +1 estrella":"💡 Revisa y vuelve a intentarlo después.";if(ok)addStar()}
function writingLab(items, id){
 const chars=[...new Set(items.flatMap(x=>x.hanzi.replace(/[\/\s]/g,"").split("")))];
 return `<div class="canvasWrap">
  <div><canvas id="cv_${id}" width="600" height="600"></canvas><div class="actions"><button class="primary" onclick="clearCanvas('${id}')">🧽 Borrar</button><button class="secondary" onclick="toggleGuide('${id}')">👀 Guía</button><button class="yellow" onclick="addStar()">⭐ Terminé</button></div></div>
  <div class="writePanel"><h3>✍️ Traza el carácter</h3><p class="help">Elige un carácter, repásalo varias veces y luego intenta escribirlo sin guía.</p>
  <select class="charSelect" id="sel_${id}" onchange="setGuide('${id}')">${chars.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>
  <div class="example"><b>Reto:</b> di en voz alta el carácter o la palabra completa mientras la escribes.</div>
  </div></div>`;
}
let guides={};
function setupCanvas(id){
 const cv=document.getElementById("cv_"+id); if(!cv)return; const ctx=cv.getContext("2d"); let drawing=false;
 function pos(e){const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [(p.clientX-r.left)*cv.width/r.width,(p.clientY-r.top)*cv.height/r.height]}
 function down(e){drawing=true;ctx.beginPath();ctx.moveTo(...pos(e));e.preventDefault()}
 function move(e){if(!drawing)return;ctx.lineWidth=18;ctx.lineCap="round";ctx.strokeStyle="#5c3e77";ctx.lineTo(...pos(e));ctx.stroke();e.preventDefault()}
 function up(){drawing=false}
 cv.addEventListener("mousedown",down);cv.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
 cv.addEventListener("touchstart",down,{passive:false});cv.addEventListener("touchmove",move,{passive:false});window.addEventListener("touchend",up);
 guides[id]=true;setGuide(id);
}
function setGuide(id){clearCanvas(id,false)}
function clearCanvas(id,keep=true){const cv=document.getElementById("cv_"+id),ctx=cv.getContext("2d");ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle="#e6e1ec";ctx.lineWidth=2;ctx.setLineDash([10,10]);ctx.beginPath();ctx.moveTo(300,0);ctx.lineTo(300,600);ctx.moveTo(0,300);ctx.lineTo(600,300);ctx.stroke();ctx.setLineDash([]);if(guides[id]){const ch=document.getElementById("sel_"+id).value;ctx.fillStyle="rgba(107,75,123,.15)";ctx.font='bold 390px "Microsoft YaHei","PingFang SC",sans-serif';ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(ch,300,315)}}
function toggleGuide(id){guides[id]=!guides[id];clearCanvas(id,false)}

function sentenceBuilder(id, sentence){
 const tokens=sentence.replace(/[。？]/g,"").split("");
 let shuffled=[...tokens].sort(()=>Math.random()-.5);
 return `<div><div class="builder" id="pool_${id}">${shuffled.map(t=>`<button class="token" onclick="moveTok(this,'target_${id}')">${t}</button>`).join("")}</div><div class="target" id="target_${id}"></div><div class="actions"><button class="primary" onclick="checkBuild('${id}','${sentence.replace(/[。？]/g,"")}')">✅ Revisar</button><button class="danger" onclick="resetBuild('${id}')">↩️ Reiniciar</button></div><div class="feedback" id="fb_${id}"></div></div>`;
}
function moveTok(btn,target){document.getElementById(target).appendChild(btn);btn.onclick=()=>document.getElementById(target.replace("target","pool")).appendChild(btn)}
function checkBuild(id,ans){const got=[...document.getElementById("target_"+id).children].map(x=>x.textContent).join("");const fb=document.getElementById("fb_"+id);if(got===ans){fb.textContent="✅ ¡Oración correcta! +2 estrellas";addStar(2)}else fb.textContent="💡 Aún no. Revisa el orden: sujeto → expresión → verbo/objeto."}
function resetBuild(id){const p=document.getElementById("pool_"+id),t=document.getElementById("target_"+id);[...t.children].forEach(x=>p.appendChild(x));document.getElementById("fb_"+id).textContent=""}

function freeSentence(prompt, placeholder){
 return `<div class="qbox"><div class="qtitle">${prompt}</div><input class="inputline" placeholder="${placeholder||'Escribe aquí en chino…'}"><div class="actions"><button class="yellow" onclick="addStar()">⭐ Guardé mi oración</button></div></div>`;
}

function render(){
 const nav=document.getElementById("nav"), main=document.getElementById("main");
 nav.innerHTML=sections.map((s,i)=>`<button data-id="${s.id}" class="${i===0?'active':''}" onclick="go('${s.id}',this)">${s.emoji} ${s.title}</button>`).join("");
 main.innerHTML=`<div class="ios-tip"><strong>📱 Modo iPad/iPhone:</strong> toca las tarjetas para voltearlas, usa el dedo o Apple Pencil para escribir y pulsa 🔊 para escuchar. En Safari, si está publicado en la web, puedes usar <b>Compartir → Añadir a pantalla de inicio</b>.</div>
 <section id="hobbies" class="section active">
  <div class="hero"><h1>🎨 Pasatiempos</h1><p>Aprende el vocabulario de las lecciones. No repetimos palabras duplicadas entre archivos.</p></div>
  <div class="activity"><span class="kicker">Actividad 1 · Vocabulario + lectura</span><h2>Flashcards mágicas</h2><p class="help">Mira carácter y pinyin; voltea para ver significado e imagen. Usa 🔊 para escuchar.</p>${flashcards(DATA.hobbies)}</div>
  <div class="activity"><span class="kicker">Actividad 2 · Escritura</span><h2>Laboratorio de caracteres</h2>${writingLab(DATA.hobbies,"hob")}</div>
  <div class="activity"><span class="kicker">Actividad 3 · Comprensión + oración</span><h2>¿Qué pasatiempo es?</h2>${choiceQuiz("qh",[

function go(id,btn){document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");window.scrollTo({top:0,behavior:"smooth"});setTimeout(setupAll,50)}
function setupAll(){["hob","food","ai","xh","hui","ch","zui"].forEach(id=>{const c=document.getElementById("cv_"+id);if(c && !c.dataset.ready){c.dataset.ready="1";setupCanvas(id)}});updateStars()}
function lightning(){const all=[...DATA.hobbies,...DATA.foods];const x=all[Math.floor(Math.random()*all.length)];document.getElementById("light").innerHTML=`${x.hanzi}<div class="pinyin">${x.pinyin}</div>`;speak(x.hanzi)}
render();
